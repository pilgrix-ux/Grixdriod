name: GRIXDroid Web + Rust Verification

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "server/**"
      - ".env.worker.example"
      - "docs/CLOUD_DEVICE_ARCHITECTURE.md"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cloud-device-typecheck.yml"
  pull_request:
    paths:
      - "src/**"
      - "server/**"
      - ".env.worker.example"
      - "supabase/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grixdroid-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Test cloud worker input validation
        run: npm run test:worker

      - name: Build browser application and type-check TypeScript
        run: npm run build

      - name: Run Rust unit tests
        run: cargo test --locked --lib
