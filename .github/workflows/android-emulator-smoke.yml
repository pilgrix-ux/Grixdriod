name: Android Emulator Smoke (Free macOS)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "server/cloud-worker.mjs"
      - "server/cloud-worker.android-smoke.mjs"
      - "server/cloud-worker.test.mjs"
      - ".env.worker.example"
  pull_request:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "server/cloud-worker.mjs"
      - "server/cloud-worker.android-smoke.mjs"
      - "server/cloud-worker.test.mjs"
      - ".env.worker.example"

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-real-android:
    # Standard macOS runners are free for public repositories.
    # macOS uses Apple's Hypervisor.framework, so this job does not need Linux KVM.
    runs-on: macos-15-intel
    timeout-minutes: 35

    steps:
      - name: Check out GRIXDroid
        uses: actions/checkout@v4

      - name: Ensure Android SDK command-line tools are installed
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "The runner did not expose ANDROID_SDK_ROOT or ANDROID_HOME."
            exit 1
          fi

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools."
            find "$SDK_ROOT" -maxdepth 5 -type f -name sdkmanager -print || true
            exit 1
          fi

          "$SDKMANAGER" --install "cmdline-tools;latest"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          if [ ! -x "$AVDMANAGER" ]; then
            echo "Android SDK package installation completed, but avdmanager is still missing."
            find "$SDK_ROOT/cmdline-tools" -maxdepth 5 -type f -name avdmanager -print || true
            exit 1
          fi
          echo "AVDMANAGER_PATH=$AVDMANAGER" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Validate worker scripts before booting Android
        run: |
          node --check server/cloud-worker.mjs
          node --check server/cloud-worker.android-smoke.mjs
          node --test server/cloud-worker.test.mjs

      - name: Set up Java for Maestro
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot Android and smoke-test system services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          avd-name: grixdroid-real-android
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -euo pipefail

            echo "Android system properties:"
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk

            echo "Checking Android has completed boot:"
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            echo "Checking Android Settings and Google Play components:"
            test -n "$(adb shell pm path com.android.settings)"
            test -n "$(adb shell pm path com.android.vending)"
            test -n "$(adb shell pm path com.google.android.gms)"
            adb shell pm path com.android.vending
            adb shell pm path com.google.android.gms

            echo "Launching the Play Store app (no Google account is added in CI):"
            adb shell monkey -p com.android.vending 1
            sleep 5

            echo "Testing the actual GRIXDroid worker against this Android AVD:"
            node server/cloud-worker.android-smoke.mjs

            echo "Running the GRIXDroid Maestro UI smoke flow:"
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro --version
            maestro test .maestro/emulator-smoke.yaml

      - name: Save Android and Maestro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grixdroid-android-smoke-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/grixdroid-playstore.png
            ${{ runner.temp }}/grixdroid-android-activities.txt
            ${{ runner.temp }}/grixdroid-android-smoke.txt
            ${{ runner.temp }}/grixdroid-android-fingerprint.txt
            ~/.maestro/tests/
          if-no-files-found: warn
          retention-days: 3
