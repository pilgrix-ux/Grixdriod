name: Android Emulator Smoke (Free macOS)

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "server/cloud-worker.mjs"
      - "server/cloud-worker.test.mjs"
      - ".env.worker.example"
  pull_request:
    paths:
      - ".github/workflows/android-emulator-smoke.yml"
      - "server/cloud-worker.mjs"
      - "server/cloud-worker.test.mjs"
      - ".env.worker.example"

permissions:
  contents: read

concurrency:
  group: android-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boot-real-android:
    # Standard macOS runners are free for public repositories.
    # macOS uses Apple's Hypervisor.framework, so this job does not need Linux KVM.
    runs-on: macos-15-intel
    timeout-minutes: 35

    steps:
      - name: Check out GRIXDroid
        uses: actions/checkout@v4

      - name: Boot Android and smoke-test system services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          avd-name: grixdroid-real-android
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            set -euo pipefail

            echo "Android system properties:"
            adb shell getprop ro.build.version.release
            adb shell getprop ro.build.version.sdk

            echo "Checking Android has completed boot:"
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"

            echo "Checking Android Settings and Google Play components:"
            test -n "$(adb shell pm path com.android.settings)"
            test -n "$(adb shell pm path com.android.vending)"
            test -n "$(adb shell pm path com.google.android.gms)"
            adb shell pm path com.android.vending
            adb shell pm path com.google.android.gms

            echo "Launching the Play Store app (no Google account is added in CI):"
            adb shell monkey -p com.android.vending 1
            sleep 5

            echo "Proving Android /data survives a full emulator stop and restart:"
            adb shell settings put global grixdroid_persistence_probe survives_restart
            adb shell sync
            AVD_NAME="$(emulator -list-avds | head -n 1)"
            SERIAL="$(adb devices | awk '/^emulator-[0-9]+[[:space:]]+device$/ { print $1; exit }')"
            test -n "$AVD_NAME"
            test -n "$SERIAL"
            PORT="${SERIAL#emulator-}"
            adb -s "$SERIAL" emu kill
            adb -s "$SERIAL" wait-for-disconnect || true
            nohup emulator -avd "$AVD_NAME" -port "$PORT" -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/grixdroid-emulator-restart.log" 2>&1 &
            adb -s "$SERIAL" wait-for-device
            for attempt in $(seq 1 180); do
              BOOTED="$(adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$BOOTED" = "1" ]; then break; fi
              sleep 3
            done
            test "$(adb -s "$SERIAL" shell getprop sys.boot_completed | tr -d '\r')" = "1"
            test "$(adb -s "$SERIAL" shell settings get global grixdroid_persistence_probe | tr -d '\r')" = "survives_restart"
            test -n "$(adb -s "$SERIAL" shell pm path com.android.vending)"
            test -n "$(adb -s "$SERIAL" shell pm path com.google.android.gms)"

            echo "Capturing restarted Android and Play Store evidence:"
            adb -s "$SERIAL" shell monkey -p com.android.vending 1
            sleep 5
            adb -s "$SERIAL" exec-out screencap -p > "$RUNNER_TEMP/grixdroid-playstore.png"
            adb -s "$SERIAL" shell dumpsys activity activities > "$RUNNER_TEMP/grixdroid-android-activities.txt"
            adb -s "$SERIAL" shell getprop ro.build.fingerprint > "$RUNNER_TEMP/grixdroid-android-fingerprint.txt"

            echo "Real Android + Play Store + retained /data stop/start smoke test passed." | tee "$RUNNER_TEMP/grixdroid-android-smoke.txt"

      - name: Save Android boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grixdroid-android-smoke-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/grixdroid-playstore.png
            ${{ runner.temp }}/grixdroid-android-activities.txt
            ${{ runner.temp }}/grixdroid-android-smoke.txt
            ${{ runner.temp }}/grixdroid-android-fingerprint.txt
            ${{ runner.temp }}/grixdroid-emulator-restart.log
          if-no-files-found: warn
          retention-days: 3
